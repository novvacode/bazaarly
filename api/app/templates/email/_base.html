<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f6f4f1;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#2a2521;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f4f1;padding:24px 12px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;border:1px solid #e8e3dc;">
          <tr><td style="padding:24px 24px 8px;">
            <p style="margin:0;font-size:13px;color:#8a8078;">{{ business_name }}</p>
            <h1 style="margin:6px 0 0;font-size:22px;line-height:1.3;">{% block heading %}{% endblock %}</h1>
          </td></tr>
          <tr><td style="padding:8px 24px 24px;font-size:15px;line-height:1.5;">
            {% block body %}{% endblock %}
          </td></tr>
        </table>
        <p style="font-size:12px;color:#8a8078;margin:16px 0 0;">Sent by Bazaarly on behalf of {{ business_name }}.</p>
      </td></tr>
    </table>
  </body>
</html>
