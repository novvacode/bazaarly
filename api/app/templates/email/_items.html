<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:12px 0;border-top:1px solid #eee;">
  {% for item in items %}
  <tr>
    <td style="padding:6px 0;">{{ item.quantity }} × {{ item.name }}</td>
    <td style="padding:6px 0;text-align:right;white-space:nowrap;">{{ item.line_total }}</td>
  </tr>
  {% endfor %}
  {% if delivery_fee %}
  <tr><td style="padding:6px 0;color:#8a8078;">Delivery</td><td style="padding:6px 0;text-align:right;color:#8a8078;">{{ delivery_fee }}</td></tr>
  {% endif %}
  <tr><td style="padding:8px 0;border-top:1px solid #eee;font-weight:600;">Total</td><td style="padding:8px 0;border-top:1px solid #eee;text-align:right;font-weight:600;">{{ total }}</td></tr>
</table>
