name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bazaarly
          POSTGRES_PASSWORD: bazaarly
          POSTGRES_DB: bazaarly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bazaarly" --health-interval 5s --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://bazaarly:bazaarly@localhost:5432/bazaarly
      TEST_DATABASE_URL: postgresql+asyncpg://bazaarly:bazaarly@localhost:5432/bazaarly_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Create test database
        run: |
          PGPASSWORD=bazaarly psql -h localhost -U bazaarly -d bazaarly -c "CREATE DATABASE bazaarly_test"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Coverage summary
        if: always()
        run: |
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

  e2e:
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          {
            echo "LLM_PROVIDER=fake"
            echo "EMBEDDER=fake"
            echo "RATE_LIMIT_ENABLED=false"
          } >> .env
      - name: Start stack
        run: docker compose --profile app up -d --build --wait
      - name: Seed
        run: docker compose exec -T api python -m scripts.seed
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:3000
        run: pnpm e2e
      - name: Upload trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
      - name: Compose logs
        if: failure()
        run: docker compose --profile app logs --tail=200

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pip-audit
        working-directory: api
        run: uv run pip-audit || true
      - name: pnpm audit
        working-directory: web
        run: pnpm install --frozen-lockfile && (pnpm audit --prod || true)
