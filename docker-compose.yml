name: bazaarly

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bazaarly
      POSTGRES_PASSWORD: bazaarly
      POSTGRES_DB: bazaarly
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaarly"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bazaarly &&
      mc anonymous set download local/bazaarly
      "

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # --- Full stack in containers (used by E2E in CI): `docker compose --profile app up` ---
  api:
    profiles: ["app"]
    build: ./api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://bazaarly:bazaarly@postgres:5432/bazaarly
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailpit
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: ./api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://bazaarly:bazaarly@postgres:5432/bazaarly
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailpit
    command: python -m app.queue.worker
    depends_on:
      api: { condition: service_healthy }

  web:
    profiles: ["app"]
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
